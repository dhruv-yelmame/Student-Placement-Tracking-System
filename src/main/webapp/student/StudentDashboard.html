<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: Arial, sans-serif;
	background: #EEF2FF;
	overflow: hidden;
}

/* Sidebar */
.sidebar {
	width: 260px;
	height: 100vh;
	background: #111827;
	position: fixed;
	left: 0;
	top: 0;
	color: white;
	padding-top: 20px;
}

.logo {
	text-align: center;
	margin-bottom: 35px;
}

.logo h2 {
	font-size: 28px;
	font-weight: bold;
}

.logo p {
	color: #9CA3AF;
}

.menu-title {
	padding: 12px 25px;
	color: #9CA3AF;
	font-size: 13px;
	text-transform: uppercase;
}

.sidebar a {
	display: flex;
	align-items: center;
	gap: 12px;
	color: white;
	text-decoration: none;
	padding: 15px 25px;
	transition: 0.3s;
}

.sidebar a:hover {
	background: #2563EB;
}

/* Main */
.main-content {
	margin-left: 260px;
	height: 100vh;
}

/* Topbar */
.topbar {
	height: 70px;
	background: white;
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 0 30px;
	box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.08);
}

.profile {
	display: flex;
	align-items: center;
	gap: 10px;
	font-weight: bold;
}

.profile i {
	font-size: 35px;
	color: #2563EB;
}

/* iframe */
.iframe-box {
	height: calc(100vh - 70px);
	padding: 20px;
}

iframe {
	width: 100%;
	height: 100%;
	border: none;
	border-radius: 18px;
	background: white;
	box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.08);
}
</style>

</head>

<body>

	<!-- Sidebar -->

	<div class="sidebar">

		<div class="logo">

			<h2>

				<i class="bi bi-mortarboard-fill"></i> SPTS

			</h2>

			<p>Student Dashboard</p>

		</div>

		<div class="menu-title">Main</div>

		<!-- IMPORTANT FIX -->
		<!-- DO NOT LOAD SAME PAGE INSIDE IFRAME -->

		<a href="../StudentDashboardServlet" target="contentFrame"> <i
			class="bi bi-house-door-fill"></i> Dashboard

		</a>

		<div class="menu-title">Profile</div>

		<a href="../ViewProfileServlet" target="contentFrame"> <i
			class="bi bi-person-circle"></i> View Profile

		</a> <a href="../UpdateProfileServlet" target="contentFrame"> <i
			class="bi bi-pencil-square"></i> Update Profile

		</a>

		<div class="menu-title">Companies</div>

		<a href="../StudentViewCompanyServlet" target="contentFrame"> <i
			class="bi bi-buildings-fill"></i> View Companies

		</a>

		<div class="menu-title">Placement</div>

		<a href="../StudentPlacementStatusServlet" target="contentFrame">

			<i class="bi bi-briefcase-fill"></i> Placement Status

		</a> <a href="../StudentLogoutServlet"> <i
			class="bi bi-box-arrow-right"></i> Logout

		</a>

	</div>

	<!-- Main Content -->

	<div class="main-content">

		<!-- iframe -->

		<div class="iframe-box">

			<!-- IMPORTANT FIX -->
			<!-- DO NOT USE StudentDashboardServlet -->

			<iframe name="contentFrame" src="../StudentDashboardServlet">

			</iframe>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
