<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: Arial, sans-serif;
	background: #f1f5f9;
	overflow: hidden;
}

/* Sidebar */

.sidebar {
	width: 260px;
	height: 100vh;
	background: linear-gradient(180deg, #1e3a8a, #2563eb);
	position: fixed;
	left: 0;
	top: 0;
	padding: 25px 15px;
}

/* Logo */

.logo {
	text-align: center;
	margin-bottom: 40px;
	color: white;
}

.logo h2 {
	font-size: 30px;
	font-weight: bold;
	margin-bottom: 8px;
}

.logo p {
	color: #dbeafe;
	font-size: 15px;
}

/* Menu Title */

.menu-title {
	color: #cbd5e1;
	font-size: 13px;
	margin: 18px 12px 10px;
	text-transform: uppercase;
	letter-spacing: 1px;
}

/* Sidebar Links */

.sidebar a {
	display: flex;
	align-items: center;
	gap: 12px;
	color: white;
	text-decoration: none;
	padding: 14px 16px;
	border-radius: 12px;
	margin-bottom: 10px;
	font-size: 16px;
	transition: 0.3s;
}

.sidebar a:hover {
	background: rgba(255, 255, 255, 0.15);
	transform: translateX(5px);
}

/* Main Content */

.main-content {
	margin-left: 260px;
	height: 100vh;
	display: flex;
	flex-direction: column;
}

/* Topbar */

.topbar {
	height: 75px;
	background: white;
	display: flex;
	justify-content: space-between;
	align-items: center;
	padding: 0 30px;
	box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.08);
}

.topbar h3 {
	font-size: 28px;
	font-weight: bold;
	color: #1e293b;
}

.profile {
	display: flex;
	align-items: center;
	gap: 10px;
	font-weight: bold;
	color: #1e293b;
}

.profile i {
	font-size: 38px;
	color: #2563eb;
}

/* iframe Box */

.iframe-box {
	flex: 1;
	padding: 20px;
}

/* iframe */

iframe {
	width: 100%;
	height: 100%;
	border: none;
	border-radius: 20px;
	background: white;
	box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.08);
}

/* Responsive */

@media ( max-width :768px) {

	body {
		overflow: auto;
	}

	.sidebar {
		width: 100%;
		height: auto;
		position: relative;
	}

	.main-content {
		margin-left: 0;
		height: auto;
	}

	.topbar {
		padding: 15px;
	}

	.topbar h3 {
		font-size: 22px;
	}

	.iframe-box {
		height: auto;
	}

	iframe {
		height: 700px;
	}
}
</style>

</head>

<body>

	<!-- Sidebar -->

	<div class="sidebar">

		<div class="logo">

			<h2>

				<i class="bi bi-mortarboard-fill"></i> SPTS

			</h2>

			<p>Student Dashboard</p>

		</div>

		<div class="menu-title">MAIN MENU</div>

		<!-- Dashboard -->

		<a href="../StudentDashboardServlet" target="contentFrame">

			<i class="bi bi-speedometer2"></i>

			Dashboard

		</a>

		<div class="menu-title">PROFILE</div>

		<!-- View Profile -->

		<a href="../ViewProfileServlet" target="contentFrame">

			<i class="bi bi-person-circle"></i>

			View Profile

		</a>

		<!-- Update Profile -->

		<a href="../UpdateProfileServlet" target="contentFrame">

			<i class="bi bi-pencil-square"></i>

			Update Profile

		</a>

		<div class="menu-title">COMPANIES</div>

		<!-- View Companies -->

		<a href="../StudentViewCompanyServlet" target="contentFrame">

			<i class="bi bi-buildings"></i>

			View Companies

		</a>

		<div class="menu-title">PLACEMENT</div>

		<!-- Placement Status -->

		<a href="../StudentPlacementStatusServlet"
			target="contentFrame">

			<i class="bi bi-briefcase-fill"></i>

			Placement Status

		</a>

		<!-- Logout -->

		<a href="../StudentLogoutServlet">

			<i class="bi bi-box-arrow-right"></i>

			Logout

		</a>

	</div>

	<!-- Main Content -->

	<div class="main-content">

		<!-- Topbar -->

		<div class="topbar">

			<h3>

				<i class="bi bi-speedometer2"></i>

				Student Dashboard

			</h3>

		</div>

		<!-- iframe -->

		<div class="iframe-box">

			<iframe name="contentFrame"
				src="../StudentDashboardServlet">

			</iframe>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
