<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login - DD Institute</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: linear-gradient(135deg, #1e3a8a, #2563eb);
	min-height: 100vh;
	font-family: Arial, sans-serif;
}

.login-container {
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 20px;
}

.login-box {
	width: 100%;
	max-width: 420px;
}

.card {
	border: none;
	border-radius: 20px;
	overflow: hidden;
	box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
}

.card-header {
	background: white;
	text-align: center;
	padding: 35px 20px 20px;
	border: none;
}

.card-header i {
	font-size: 70px;
	color: #2563eb;
}

.card-body {
	padding: 35px;
}

.form-control {
	height: 50px;
	border-radius: 12px;
}

.btn-login, .btn-register {
	height: 50px;
	border-radius: 12px;
	font-size: 18px;
	font-weight: bold;
}

.footer-text {
	text-align: center;
	margin-top: 20px;
	color: #6b7280;
}
</style>

</head>

<body>

	<div class="login-container">

		<div class="login-box">

			<div class="card">

				<div class="card-header">

					<i class="bi bi-mortarboard-fill"></i>

					<h2>Student Login</h2>

				</div>

				<div class="card-body">

					<form action="/Servlet1/StudentLoginServlet" method="post">

						<div class="mb-4">

							<input type="email" name="email" class="form-control"
								placeholder="Enter Email" required>

						</div>

						<div class="mb-4">

							<input type="password" name="password" class="form-control"
								placeholder="Enter Password" required>

						</div>

						<div class="mb-3">

							<input type="submit" value="Login"
								class="btn btn-primary btn-login w-100">

						</div>

					</form>

					<div class="mb-3">

						<a href="StudentRegister.html"
							class="btn btn-success btn-register w-100"> Register </a>

					</div>

					<div class="footer-text">Placement Tracking System</div>

				</div>

			</div>

		</div>

	</div>

</body>

</html>
