<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	background: linear-gradient(135deg, #1e3a8a, #2563eb);
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	font-family: Arial, sans-serif;
}

.login-box {
	width: 100%;
	max-width: 420px;
}

.card {
	border: none;
	border-radius: 20px;
	overflow: hidden;
	box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
}

.card-header {
	background: white;
	text-align: center;
	padding: 35px 20px 20px;
	border: none;
}

.card-header i {
	font-size: 70px;
	color: #2563eb;
}

.card-header h2 {
	margin-top: 15px;
	font-weight: bold;
}

.card-body {
	padding: 35px;
}

.form-control {
	height: 50px;
	border-radius: 12px;
	font-size: 16px;
}

.form-control:focus {
	box-shadow: none;
	border: 2px solid #2563eb;
}

.btn-login {
	height: 50px;
	border-radius: 12px;
	font-size: 18px;
	font-weight: bold;
	background: #2563eb;
	border: none;
}

.btn-login:hover {
	background: #1d4ed8;
}

.footer-text {
	text-align: center;
	color: #6b7280;
	margin-top: 20px;
	font-size: 14px;
}
</style>

</head>

<body>

	<div class="login-box">

		<div class="card">

			<!-- Header -->

			<div class="card-header">

				<i class="bi bi-person-circle"></i>

				<h2>Admin Login</h2>

			</div>

			<!-- Body -->

			<div class="card-body">

				<form action="../AdminLoginServlet" method="post">

					<div class="mb-4">

						<input type="text" name="username" class="form-control"
							placeholder="Enter Username" required>

					</div>

					<div class="mb-4">

						<input type="password" name="password" class="form-control"
							placeholder="Enter Password" required>

					</div>

					<div>

						<input type="submit" value="Login"
							class="btn btn-primary btn-login w-100">

					</div>

				</form>

				<div class="footer-text">Placement Tracking System</div>

			</div>

		</div>

	</div>

</body>
</html>
